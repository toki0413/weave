name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit pyflakes
      # 未定义名（F821）必须阻断：`session.py` 曾调用一个从未导入的
      # build_personal_baseline，接口在第 8 条会话时 500，而全量测试没走过
      # 那条路径。只卡 undefined name，unused import 不阻断。
      - name: Static check (undefined names)
        run: |
          out=$(pyflakes app/ | grep "undefined name" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      # 中危及以上直接阻断（当前基线：0 High / 0 Medium）
      - name: Run bandit (fail on medium+)
        run: bandit -r app/ -ll
      # 依赖漏洞以报告形式产出：不放行新引入的高危依赖，但不因历史条目阻断构建
      - name: Dependency audit report
        run: pip-audit -r requirements.txt --desc on || true

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (for STT)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # jieba 0.42.1 setup.py 用 from distutils.core import setup, Python 3.12 已移除 distutils
          pip install setuptools
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          CG_DISABLE_REDIS: "1"
          CG_DISABLE_RATE_LIMIT: "1"
          CG_KMS_PROVIDER: "env"
          # EnvKMS 要求 base64 编码的 32 字节密钥（此值即 32 个零字节）
          CG_KMS_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=55

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (vitest)
        run: npx vitest run

      - name: Run tests (node:test specs)
        run: node --test "src/tests/*.spec.mjs"

      - name: Build
        run: npm run build

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --upload.target=temporary-public-storage || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Assert Lighthouse scores
        run: |
          npm install -g lighthouse
          lighthouse http://localhost:4173 --output=json --output-path=./lhci-report.json --chrome-flags="--headless --no-sandbox" || true
          # Thresholds: Performance > 70, Accessibility > 90
        env:
          LHCI_MIN_SCORE_PERFORMANCE: 70
          LHCI_MIN_SCORE_ACCESSIBILITY: 90
