version: "3.9"

# ============ 织忆 · 认知花园 生产编排 ============
# 必要环境变量（缺失时 compose 直接拒绝启动，避免以默认凭据上线）：
#   CG_PG_PASSWORD     PostgreSQL 密码
#   CG_REDIS_PASSWORD  Redis 密码
#   CG_JWT_SECRET      JWT 签名密钥（≥32 字节随机串，生成：openssl rand -hex 32）
# 可选：CG_CORS_ORIGINS（跨域前端域名，逗号分隔）、CG_METRICS_TOKEN、
#      CG_KMS_MASTER_KEY（kms_provider=env 时必填）
# 启动：cp .env.example .env && 填写后 docker compose --profile with-nginx up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cg-backend
    # 仅供宿主机调试；对外流量一律经 nginx
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - CG_PORT=8004
      - CG_HOST=0.0.0.0
      - CG_DEBUG=0
      - CG_DATABASE_URL=postgresql+psycopg2://cg_user:${CG_PG_PASSWORD:?CG_PG_PASSWORD 未设置}@postgres:5432/cognitive_garden
      - CG_REDIS_URL=redis://:${CG_REDIS_PASSWORD:?CG_REDIS_PASSWORD 未设置}@redis:6379/0
      - CG_JWT_SECRET=${CG_JWT_SECRET:?CG_JWT_SECRET 未设置}
      # KMS：env（单机生产）/ aws（云上生产）
      - CG_KMS_PROVIDER=${CG_KMS_PROVIDER:-env}
      - CG_KMS_MASTER_KEY=${CG_KMS_MASTER_KEY:-}
      - CG_KMS_KEY_ID=${CG_KMS_KEY_ID:-}
      - CG_KMS_AWS_REGION=${CG_KMS_AWS_REGION:-}
      - CG_CORS_ORIGINS=${CG_CORS_ORIGINS:-}
      # 前置 nginx 可信，限流与审计按真实客户端 IP 统计
      - CG_TRUST_PROXY=1
      - CG_METRICS_TOKEN=${CG_METRICS_TOKEN:-}
      - CG_SERVE_UPLOADS=0
      - CG_DATA_DIR=/app/uploads
      - CG_LOG_DIR=/app/logs
      - access_token_expire_minutes=30
      - refresh_token_expire_days=7
    volumes:
      - cg_uploads:/app/uploads
      - cg_backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: cg-postgres
    environment:
      - POSTGRES_DB=cognitive_garden
      - POSTGRES_USER=cg_user
      - POSTGRES_PASSWORD=${CG_PG_PASSWORD:?CG_PG_PASSWORD 未设置}
    volumes:
      - cg_pg_data:/var/lib/postgresql/data
    # 不对公网暴露：仅在容器网络内提供服务
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg_user -d cognitive_garden"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: cg-redis
    # 强制密码 + 关闭危险命令；不开公网端口
    command: ["redis-server", "--requirepass", "${CG_REDIS_PASSWORD:?CG_REDIS_PASSWORD 未设置}", "--rename-command", "FLUSHALL", ""]
    volumes:
      - cg_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${CG_REDIS_PASSWORD:?CG_REDIS_PASSWORD 未设置}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 数据库定时备份（gap S2）：每 24h 一次 pg_dump 自定义格式，本地滚动保留 14 天。
  # 恢复：docker exec -i cg-pg-backup pg_restore -h postgres -U cg_user -d cognitive_garden --clean /backups/<文件名>
  # 备份卷仍在同一台机器上——异地容灾请另行把 cg_pg_backups 卷同步到对象存储。
  pg-backup:
    image: postgres:16-alpine
    container_name: cg-pg-backup
    environment:
      - PGPASSWORD=${CG_PG_PASSWORD:?CG_PG_PASSWORD 未设置}
      - BACKUP_KEEP_DAYS=14
      - BACKUP_INTERVAL_SEC=86400
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        while true; do
          STAMP=$$(date -u +%Y%m%d_%H%M%S)
          echo "[pg-backup] dump start $${STAMP}"
          if pg_dump -h postgres -U cg_user -d cognitive_garden -Fc \
               -f "/backups/cg_$${STAMP}.dump"; then
            echo "[pg-backup] dump ok $${STAMP}"
          else
            echo "[pg-backup] dump FAILED $${STAMP}" >&2
          fi
          find /backups -name 'cg_*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep $${BACKUP_INTERVAL_SEC}
        done
    volumes:
      - cg_pg_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 监控与告警（gap S1）：采集后端 /metrics 并评估 alert_rules.yml 三条规则。
  # 默认不随主栈启动：docker compose --profile with-monitoring up -d
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cg-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - cg_prom_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - "with-monitoring"

  nginx:
    image: nginx:alpine
    container_name: cg-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    profiles:
      - "with-nginx"

volumes:
  cg_uploads:
  cg_backend_logs:
  cg_pg_data:
  cg_redis_data:
  cg_pg_backups:
  cg_prom_data:
