version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cg-backend
    ports:
      - "8004:8004"
    environment:
      - CG_PORT=8004
      - CG_HOST=0.0.0.0
      # PostgreSQL（生产用；留空则回退到 SQLite）
      - database_url=postgresql+psycopg2://cg_user:cg_pass@postgres:5432/cognitive_garden
      # Redis（限流/SSE/token 黑名单；留空则降级到内存模式）
      - redis_url=redis://redis:6379/0
      # KMS：local（开发）/ env（单机生产）/ aws（云上生产）
      - kms_provider=env
      - kms_master_key=${CG_KMS_MASTER_KEY:-}
      # JWT
      - access_token_expire_minutes=30
      - refresh_token_expire_days=7
    volumes:
      - cg_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cg-postgres
    environment:
      - POSTGRES_DB=cognitive_garden
      - POSTGRES_USER=cg_user
      - POSTGRES_PASSWORD=cg_pass
    volumes:
      - cg_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg_user -d cognitive_garden"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cg-redis
    ports:
      - "6379:6379"
    volumes:
      - cg_redis_data:/data
    restart: unless-stopped

  # 数据库定时备份（gap S2）：每 24h 一次 pg_dump 自定义格式，本地滚动保留 14 天。
  # 恢复：docker exec -i cg-pg-backup pg_restore -h postgres -U cg_user -d cognitive_garden --clean /backups/<文件名>
  # 备份卷仍在同一台机器上——异地容灾请另行把 cg_pg_backups 卷同步到对象存储。
  pg-backup:
    image: postgres:16-alpine
    container_name: cg-pg-backup
    environment:
      - PGPASSWORD=cg_pass
      - BACKUP_KEEP_DAYS=14
      - BACKUP_INTERVAL_SEC=86400
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        while true; do
          STAMP=$$(date -u +%Y%m%d_%H%M%S)
          echo "[pg-backup] dump start $${STAMP}"
          if pg_dump -h postgres -U cg_user -d cognitive_garden -Fc \
               -f "/backups/cg_$${STAMP}.dump"; then
            echo "[pg-backup] dump ok $${STAMP}"
          else
            echo "[pg-backup] dump FAILED $${STAMP}" >&2
          fi
          find /backups -name 'cg_*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep $${BACKUP_INTERVAL_SEC}
        done
    volumes:
      - cg_pg_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 监控与告警（gap S1）：采集后端 /metrics 并评估 alert_rules.yml 三条规则。
  # 默认不随主栈启动：docker compose --profile with-monitoring up -d
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cg-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - cg_prom_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - "with-monitoring"

  nginx:
    image: nginx:alpine
    container_name: cg-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - "with-nginx"

volumes:
  cg_uploads:
  cg_pg_data:
  cg_redis_data:
  cg_pg_backups:
  cg_prom_data:
