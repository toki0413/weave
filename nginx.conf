# ============ 织忆 · 认知花园 生产反代配置 ============
# 职责：同源托管前端静态资源 + 反向代理 API/SSE/上传/健康检查。
# 部署：docker compose --profile with-nginx up -d
# 前提：前端已构建到 ./frontend/dist（npm ci && npm run build）。

upstream weave_backend {
    server backend:8004;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 隐藏版本号
    server_tokens off;

    # 与后端 max_audio_upload_mb 对齐（STT 音频 / 备份导入）
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # ============ 安全响应头 ============
    # 说明：前端为 Vite 构建产物，运行时无内联脚本；保留 'unsafe-inline'
    # 仅用于 style（部分组件动态写入 style 属性）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ============ 压缩 ============
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml application/xml;

    # ============ API ============
    location /api/ {
        proxy_pass http://weave_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============ SSE 实时通道 ============
    # 必须关闭缓冲，否则事件被 nginx 攒批后延迟下发；读超时须大于后端心跳间隔
    location = /events {
        proxy_pass http://weave_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;
    }

    # ============ 健康检查 ============
    location = /health {
        proxy_pass http://weave_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============ 指标端点：不对公网开放 ============
    # Prometheus 通过容器网络直连 backend:8004/metrics 采集
    location = /metrics {
        deny all;
        return 404;
    }

    # ============ 旧版上传目录：默认关闭 ============
    # 语音密文仅由鉴权后的业务接口读取；确需静态暴露时，在此显式放行
    # 并在应用侧设置 CG_SERVE_UPLOADS=1。
    location /uploads/ {
        deny all;
        return 404;
    }

    # ============ 静态资源缓存 ============
    # Vite 产物带内容哈希，可长期缓存；index.html 必须不缓存以获取新版本
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ============ SPA 回退 ============
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
